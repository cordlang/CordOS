# Native framebuffer. GRUB keeps whatever the display actually is
# (gfxmode=auto). run-vbox.ps1 may generate kbuild/grub-auto.cfg with
# gfx=WxH matching the host monitor 1:1.
set timeout=2
set default=0

insmod multiboot2
insmod iso9660
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod all_video
insmod gfxterm
insmod png

set gfxmode=auto,3840x2160x32,2560x1440x32,1920x1200x32,1920x1080x32,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x800x32,1280x720x32,1024x768x32
terminal_output gfxterm
set gfxpayload=keep
set color_normal=white/black
set color_highlight=black/white
set menu_color_normal=white/black
set menu_color_highlight=black/white
background_image -m center /boot/splash.png

menuentry "CordOS" {
    insmod multiboot2
    insmod video_bochs
    set gfxpayload=keep
    multiboot2 /boot/cordos.bin
    boot
}

menuentry "CordOS — Espanol" {
    insmod multiboot2
    insmod video_bochs
    set gfxpayload=keep
    multiboot2 /boot/cordos.bin lang=es
    boot
}

menuentry "CordOS — English" {
    insmod multiboot2
    insmod video_bochs
    set gfxpayload=keep
    multiboot2 /boot/cordos.bin lang=en
    boot
}
