# Default 1920x1080 1:1. run-vbox.ps1 may generate build/grub-auto.cfg
# with gfx=WxH matching the host screen.
set timeout=2
set default=0

insmod multiboot2
insmod iso9660
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod all_video
insmod gfxterm
insmod png

set gfxmode=1920x1080x32,1600x900x32,1280x720x32,1024x768x32
terminal_output gfxterm
set gfxpayload=keep
set color_normal=white/black
set color_highlight=black/white
set menu_color_normal=white/black
set menu_color_highlight=black/white
background_image -m center /boot/splash.png

menuentry "CordOS" {
    insmod multiboot2
    insmod video_bochs
    set gfxpayload=1920x1080x32
    multiboot2 /boot/cordos.bin gfx=1920x1080
    boot
}

menuentry "CordOS — Espanol" {
    insmod multiboot2
    insmod video_bochs
    set gfxpayload=1920x1080x32
    multiboot2 /boot/cordos.bin gfx=1920x1080 lang=es
    boot
}

menuentry "CordOS — English" {
    insmod multiboot2
    insmod video_bochs
    set gfxpayload=1920x1080x32
    multiboot2 /boot/cordos.bin gfx=1920x1080 lang=en
    boot
}
